name: Stable checkpoint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checkpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run control tests
        run: pnpm test

      - name: Verify migration snapshot is current
        run: |
          pnpm db:generate
          git diff --exit-code -- db/schema.ts drizzle

      - name: Build production worker
        run: pnpm build
